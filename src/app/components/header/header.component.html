<header class="sticky top-0 z-50 nav-glass">
  <div class="ml-auto mr-auto px-6 py-4 flex items-center" style="max-width: 1140px">

    <!-- Logo -->
    <div class="mr-auto">
      <a routerLink="" class="flex items-center gap-0.5">
        <span class="font-bold text-lg tracking-tight text-yellow-400">N</span>
        <span class="font-bold text-lg tracking-tight text-white">E</span>
        <span class="font-bold text-lg text-yellow-400">.</span>
      </a>
    </div>

    <!-- Mobile toggle -->
    <div class="block md:hidden lg:hidden xl:hidden 2xl:hidden">
      <button
        class="border border-white/15 hover:border-yellow-400/50 rounded-lg p-2 transition-colors"
        (click)="toggleMobileMenu()"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Desktop nav -->
    <nav class="hidden sm:block md:block lg:block xl:block 2xl:block">
      <ul class="flex items-center gap-8">
        <ng-container *ngFor="let nav of navList">
          <li *ngIf="nav.name !== 'Résumé'">
            <a routerLink="{{ nav.link }}"
               class="text-sm font-medium transition-colors duration-200"
               [ngClass]="{ 'text-yellow-400': currentUrl == nav.link, 'text-gray-400 hover:text-white': currentUrl != nav.link }">
              {{ nav.name }}
            </a>
          </li>
          <li *ngIf="nav.name === 'Résumé'">
            <a href="{{ nav.link }}" target="_blank"
               class="text-sm font-medium px-4 py-1.5 border border-yellow-400/50 text-yellow-400 rounded-lg hover:bg-yellow-400/10 transition-all duration-200">
              {{ nav.name }}
            </a>
          </li>
        </ng-container>
      </ul>
    </nav>
  </div>

  <!-- Mobile nav -->
  <div *ngIf="showMobileNav" class="mobile-nav-enter border-t border-white/[0.05]">
    <nav class="px-6 py-5">
      <ul class="space-y-4">
        <ng-container *ngFor="let nav of navList">
          <li *ngIf="nav.name !== 'Résumé'">
            <a routerLink="{{ nav.link }}" (click)="toggleMobileMenu()"
               class="block text-sm font-medium text-gray-300 hover:text-yellow-400 transition-colors">
              {{ nav.name }}
            </a>
          </li>
          <li *ngIf="nav.name === 'Résumé'">
            <a href="{{ nav.link }}" target="_blank" (click)="toggleMobileMenu()"
               class="block text-sm font-medium text-gray-300 hover:text-yellow-400 transition-colors">
              {{ nav.name }}
            </a>
          </li>
        </ng-container>
      </ul>
    </nav>
  </div>
</header>
